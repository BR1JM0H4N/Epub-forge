name: Build APK v4

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      # ============================================================
      # PREPARE WWW
      # ============================================================
      - name: Prepare www directory
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='ios' \
            --exclude='node_modules' \
            --exclude='www' \
            --exclude='assets-icon' \
            --exclude='capacitor.config.*' \
            --exclude='logo.png' \
            --exclude='Build-app.yml' \
            ./ www/

      # ============================================================
      # CAPACITOR DOWNLOAD BRIDGE
      # ============================================================
      - name: Add Capacitor download bridge
        shell: bash
        run: |
          cat > www/capacitor-download-bridge.js <<'EOF'
          (() => {
            document.addEventListener("click", async (event) => {
              const anchor = event.target.closest("a");

              if (!anchor) return;

              const href = anchor.href;

              if (!href || !href.startsWith("blob:")) return;

              event.preventDefault();

              try {
                const response = await fetch(href);
                const blob = await response.blob();

                const reader = new FileReader();

                reader.onloadend = async () => {
                  try {
                    const base64 = reader.result.split(",")[1];

                    if (
                      window.Capacitor &&
                      window.Capacitor.Plugins &&
                      window.Capacitor.Plugins.Filesystem
                    ) {
                      const filename =
                        anchor.download ||
                        `download-${Date.now()}`;

                      await window.Capacitor.Plugins.Filesystem.writeFile({
                        path: filename,
                        data: base64,
                        directory: "DOCUMENTS",
                        recursive: true
                      });
                    }
                  } catch (error) {
                    console.error(
                      "Capacitor download failed:",
                      error
                    );
                  }
                };

                reader.readAsDataURL(blob);

              } catch (error) {
                console.error(
                  "Blob download failed:",
                  error
                );
              }
            });
          })();
          EOF

      # ============================================================
      # CAPACITOR ANDROID
      # ============================================================
      - name: Add Capacitor Android
        run: npx cap add android

      # ============================================================
      # MATERIAL 3 + DYNAMIC COLOR BRIDGE
      # ============================================================
      - name: Inject dynamic color bridge
        shell: bash
        run: |
          set -e

          GRADLE=android/app/build.gradle
          STYLES=android/app/src/main/res/values/styles.xml

          # --------------------------------------------------------
          # Add Material Components
          # --------------------------------------------------------
          if ! grep -q "com.google.android.material:material" "$GRADLE"; then
            sed -i \
              "/dependencies[[:space:]]*{/a\\    implementation 'com.google.android.material:material:1.12.0'" \
              "$GRADLE"
          fi

          # --------------------------------------------------------
          # Set Material 3 Dynamic Colors theme
          # --------------------------------------------------------
          if [ -f "$STYLES" ]; then
            sed -i \
              's#parent="Theme\.AppCompat[^"]*"#parent="Theme.Material3.DynamicColors.DayNight.NoActionBar"#' \
              "$STYLES"

            echo "Patched Material 3 theme:"
            cat "$STYLES"
          else
            echo "WARNING: styles.xml not found."
          fi

          # --------------------------------------------------------
          # Find MainActivity.java
          # --------------------------------------------------------
          MAIN_ACTIVITY=$(find android/app/src/main/java \
            -name "MainActivity.java" \
            -type f | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity: $MAIN_ACTIVITY"

          # --------------------------------------------------------
          # Preserve package declaration
          # --------------------------------------------------------
          PACKAGE=$(grep '^package ' "$MAIN_ACTIVITY" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Package declaration not found."
            exit 1
          fi

          # --------------------------------------------------------
          # Rewrite MainActivity.java
          # --------------------------------------------------------
          cat > "$MAIN_ACTIVITY" <<EOF
          $PACKAGE

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;
          import com.google.android.material.color.DynamicColors;
          import com.google.android.material.color.MaterialColors;
          import com.google.android.material.R;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  DynamicColors.applyToActivityIfAvailable(this);

                  super.onCreate(savedInstanceState);

                  // ------------------------------------------------
                  // Use Material 3 Surface Container Lowest for
                  // Android status and navigation bars.
                  // ------------------------------------------------
                  int surfaceLowest = MaterialColors.getColor(
                          this,
                          R.attr.colorSurfaceContainerLowest,
                          0xFFFFFFFF
                  );

                  getWindow().setStatusBarColor(surfaceLowest);
                  getWindow().setNavigationBarColor(surfaceLowest);

                  WebView webView = getBridge().getWebView();

                  webView.addJavascriptInterface(
                          new DynamicColorBridge(),
                          "DynamicColorBridge"
                  );
              }

              public class DynamicColorBridge {

                  @JavascriptInterface
                  public String getPalette() {

                      int primary = resolveColor(
                              R.attr.colorPrimary
                      );

                      int onPrimary = resolveColor(
                              R.attr.colorOnPrimary
                      );

                      int primaryContainer = resolveColor(
                              R.attr.colorPrimaryContainer
                      );

                      int onPrimaryContainer = resolveColor(
                              R.attr.colorOnPrimaryContainer
                      );

                      int secondary = resolveColor(
                              R.attr.colorSecondary
                      );

                      int onSecondary = resolveColor(
                              R.attr.colorOnSecondary
                      );

                      int secondaryContainer = resolveColor(
                              R.attr.colorSecondaryContainer
                      );

                      int onSecondaryContainer = resolveColor(
                              R.attr.colorOnSecondaryContainer
                      );

                      int tertiary = resolveColor(
                              R.attr.colorTertiary
                      );

                      int onTertiary = resolveColor(
                              R.attr.colorOnTertiary
                      );

                      int tertiaryContainer = resolveColor(
                              R.attr.colorTertiaryContainer
                      );

                      int onTertiaryContainer = resolveColor(
                              R.attr.colorOnTertiaryContainer
                      );

                      int error = resolveColor(
                              R.attr.colorError
                      );

                      int onError = resolveColor(
                              R.attr.colorOnError
                      );

                      int errorContainer = resolveColor(
                              R.attr.colorErrorContainer
                      );

                      int onErrorContainer = resolveColor(
                              R.attr.colorOnErrorContainer
                      );

                      int background = resolveColor(
                              R.attr.colorBackground
                      );

                      int onBackground = resolveColor(
                              R.attr.colorOnBackground
                      );

                      int surface = resolveColor(
                              R.attr.colorSurface
                      );

                      int onSurface = resolveColor(
                              R.attr.colorOnSurface
                      );

                      int surfaceVariant = resolveColor(
                              R.attr.colorSurfaceVariant
                      );

                      int onSurfaceVariant = resolveColor(
                              R.attr.colorOnSurfaceVariant
                      );

                      int surfaceContainerLowest = resolveColor(
                              R.attr.colorSurfaceContainerLowest
                      );

                      int surfaceContainerLow = resolveColor(
                              R.attr.colorSurfaceContainerLow
                      );

                      int surfaceContainer = resolveColor(
                              R.attr.colorSurfaceContainer
                      );

                      int surfaceContainerHigh = resolveColor(
                              R.attr.colorSurfaceContainerHigh
                      );

                      int surfaceContainerHighest = resolveColor(
                              R.attr.colorSurfaceContainerHighest
                      );

                      int surfaceDim = resolveColor(
                              R.attr.colorSurfaceDim
                      );

                      int surfaceBright = resolveColor(
                              R.attr.colorSurfaceBright
                      );

                      int outline = resolveColor(
                              R.attr.colorOutline
                      );

                      int outlineVariant = resolveColor(
                              R.attr.colorOutlineVariant
                      );

                      return "{"
                              + "\\\"primary\\\":\\\"" + colorToHex(primary) + "\\\","
                              + "\\\"onPrimary\\\":\\\"" + colorToHex(onPrimary) + "\\\","
                              + "\\\"primaryContainer\\\":\\\"" + colorToHex(primaryContainer) + "\\\","
                              + "\\\"onPrimaryContainer\\\":\\\"" + colorToHex(onPrimaryContainer) + "\\\","
                              + "\\\"secondary\\\":\\\"" + colorToHex(secondary) + "\\\","
                              + "\\\"onSecondary\\\":\\\"" + colorToHex(onSecondary) + "\\\","
                              + "\\\"secondaryContainer\\\":\\\"" + colorToHex(secondaryContainer) + "\\\","
                              + "\\\"onSecondaryContainer\\\":\\\"" + colorToHex(onSecondaryContainer) + "\\\","
                              + "\\\"tertiary\\\":\\\"" + colorToHex(tertiary) + "\\\","
                              + "\\\"onTertiary\\\":\\\"" + colorToHex(onTertiary) + "\\\","
                              + "\\\"tertiaryContainer\\\":\\\"" + colorToHex(tertiaryContainer) + "\\\","
                              + "\\\"onTertiaryContainer\\\":\\\"" + colorToHex(onTertiaryContainer) + "\\\","
                              + "\\\"error\\\":\\\"" + colorToHex(error) + "\\\","
                              + "\\\"onError\\\":\\\"" + colorToHex(onError) + "\\\","
                              + "\\\"errorContainer\\\":\\\"" + colorToHex(errorContainer) + "\\\","
                              + "\\\"onErrorContainer\\\":\\\"" + colorToHex(onErrorContainer) + "\\\","
                              + "\\\"background\\\":\\\"" + colorToHex(background) + "\\\","
                              + "\\\"onBackground\\\":\\\"" + colorToHex(onBackground) + "\\\","
                              + "\\\"surface\\\":\\\"" + colorToHex(surface) + "\\\","
                              + "\\\"onSurface\\\":\\\"" + colorToHex(onSurface) + "\\\","
                              + "\\\"surfaceVariant\\\":\\\"" + colorToHex(surfaceVariant) + "\\\","
                              + "\\\"onSurfaceVariant\\\":\\\"" + colorToHex(onSurfaceVariant) + "\\\","
                              + "\\\"surfaceContainerLowest\\\":\\\"" + colorToHex(surfaceContainerLowest) + "\\\","
                              + "\\\"surfaceContainerLow\\\":\\\"" + colorToHex(surfaceContainerLow) + "\\\","
                              + "\\\"surfaceContainer\\\":\\\"" + colorToHex(surfaceContainer) + "\\\","
                              + "\\\"surfaceContainerHigh\\\":\\\"" + colorToHex(surfaceContainerHigh) + "\\\","
                              + "\\\"surfaceContainerHighest\\\":\\\"" + colorToHex(surfaceContainerHighest) + "\\\","
                              + "\\\"surfaceDim\\\":\\\"" + colorToHex(surfaceDim) + "\\\","
                              + "\\\"surfaceBright\\\":\\\"" + colorToHex(surfaceBright) + "\\\","
                              + "\\\"outline\\\":\\\"" + colorToHex(outline) + "\\\","
                              + "\\\"outlineVariant\\\":\\\"" + colorToHex(outlineVariant) + "\\\""
                              + "}";
                  }

                  private int resolveColor(int attr) {
                      return MaterialColors.getColor(
                              MainActivity.this,
                              attr,
                              0xFFFFFFFF
                      );
                  }

                  private String colorToHex(int color) {
                      return String.format(
                              "#%06X",
                              (0xFFFFFF & color)
                      );
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # Web dynamic color bridge
          # --------------------------------------------------------
          cat > www/dynamic-color-bridge.js <<'EOF'
          (() => {
            function applyDynamicColors() {
              try {
                if (
                  !window.DynamicColorBridge ||
                  !window.DynamicColorBridge.getPalette
                ) {
                  return false;
                }

                const palette =
                  JSON.parse(
                    window.DynamicColorBridge.getPalette()
                  );

                for (const [key, value] of Object.entries(palette)) {
                  document.documentElement.style.setProperty(
                    `--md-${key.replace(/[A-Z]/g, m => "-" + m.toLowerCase())}`,
                    value
                  );
                }

                document.documentElement.classList.add(
                  "dynamic-colors-ready"
                );

                window.dispatchEvent(
                  new CustomEvent("dynamic-colors-ready", {
                    detail: palette
                  })
                );

                return true;

              } catch (error) {
                console.error(
                  "Dynamic color bridge error:",
                  error
                );

                return false;
              }
            }

            let attempts = 0;

            function tryApply() {
              if (applyDynamicColors()) return;

              attempts++;

              if (attempts < 100) {
                setTimeout(tryApply, 20);
              }
            }

            tryApply();
          })();
          EOF

          # --------------------------------------------------------
          # Inject bridge into index.html
          # --------------------------------------------------------
          if [ -f "www/index.html" ]; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path("www/index.html")
          text = path.read_text()

          script = '<script src="dynamic-color-bridge.js"></script>'

          if script not in text:
              text = text.replace(
                  "</head>",
                  f"  {script}\n</head>",
                  1
              )

          path.write_text(text)
          PY
          fi

      # ============================================================
      # STORAGE PERMISSION
      # ============================================================
      - name: Add storage permission
        shell: bash
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.WRITE_EXTERNAL_STORAGE" '
              'android:maxSdkVersion="32" />'
          )

          if permission not in text:
              text = text.replace(
                  "<application",
                  permission + "\n\n    <application",
                  1
              )

          path.write_text(text)
          PY

      # ============================================================
      # PREPARE ICON
      # ============================================================
      - name: Prepare app icon
        shell: bash
        run: |
          set -e

          if [ ! -f "logo.png" ]; then
            echo "ERROR: logo.png not found in repository root."
            exit 1
          fi

          rm -rf assets-icon
          mkdir -p assets-icon

          cp logo.png assets-icon/logo.png

      # ============================================================
      # CAPACITOR ASSETS
      # ============================================================
      - name: Install Capacitor Assets
        run: npm install --save-dev @capacitor/assets

      - name: Generate Android icons
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets-icon \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#111111"

      # ============================================================
      # CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor
        run: npx cap sync android

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew

          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      # ============================================================
      # UPLOAD DEBUG
      # ============================================================
      - name: Upload Debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ============================================================
      # UPLOAD RELEASE
      # ============================================================
      - name: Upload Release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
