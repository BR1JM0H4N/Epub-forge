name: Build APK (base)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE.JS
      # ============================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: npm install


      # ============================================================
      # PREPARE STATIC WEBSITE
      #
      # Everything in the repository is copied to www/
      # except files/directories belonging to the build system.
      #
      # Your website can therefore contain:
      #
      # HTML
      # CSS
      # JS
      # JSON
      # WASM
      # ONNX
      # images
      # fonts
      # videos
      # etc.
      # ============================================================
      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='ios/' \
            --exclude='node_modules/' \
            --exclude='www/' \
            --exclude='assets-icon/' \
            --exclude='capacitor.config.*' \
            --exclude='logo.png' \
            --exclude='Build-app.yml' \
            ./ www/

          echo "=========================================="
          echo "Website files copied to www/"
          echo "=========================================="

          find www -type f | sort


          # --------------------------------------------------------
          # Capacitor download bridge
          # --------------------------------------------------------
          cat > www/capacitor-download-bridge.js << 'SCRIPT_EOF'
          (function () {
            if (!window.Capacitor || !window.Capacitor.Plugins) return;

            const { Filesystem } = window.Capacitor.Plugins;

            if (!Filesystem) {
              console.warn('Filesystem plugin missing');
              return;
            }

            function blobUrlToBase64(blobUrl) {
              return fetch(blobUrl)
                .then(function (response) {
                  return response.blob();
                })
                .then(function (blob) {
                  return new Promise(function (resolve, reject) {
                    const reader = new FileReader();

                    reader.onloadend = function () {
                      resolve(reader.result.split(',')[1]);
                    };

                    reader.onerror = reject;

                    reader.readAsDataURL(blob);
                  });
                });
            }

            async function saveAndNotify(base64Data, filename) {
              try {
                await Filesystem.writeFile({
                  path: 'Download/' + filename,
                  data: base64Data,
                  directory: 'DOCUMENTS',
                  recursive: true
                });

                alert('Saved to Downloads: ' + filename);

              } catch (error) {
                console.error('Save failed:', error);
                alert('Failed to save file: ' + error.message);
              }
            }

            var originalClick = HTMLAnchorElement.prototype.click;

            HTMLAnchorElement.prototype.click = function () {
              var href = this.getAttribute('href');
              var filename = this.getAttribute('download');

              if (
                href &&
                href.indexOf('blob:') === 0 &&
                filename
              ) {
                blobUrlToBase64(href)
                  .then(function (base64) {
                    saveAndNotify(base64, filename);
                  });

                return;
              }

              return originalClick.apply(this, arguments);
            };
          })();
          SCRIPT_EOF


          # --------------------------------------------------------
          # Inject download bridge into index.html
          # --------------------------------------------------------
          if [ -f www/index.html ]; then
            sed -i \
              's#</body>#<script src="capacitor-download-bridge.js"></script></body>#' \
              www/index.html
          else
            echo "ERROR: index.html was not found."
            exit 1
          fi


      # ============================================================
      # ADD ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        run: npx cap add android


      # ============================================================
      # DYNAMIC COLOR (Material You / Android 12+)
      #
      # 1. Adds the Material Components library dependency (not
      #    present in Capacitor's default template).
      # 2. Sets the app theme parent to a REAL Material3 style
      #    (Theme.Material3.DayNight — NOT "...DynamicColors...",
      #    which does not exist as a style name).
      # 3. Calls DynamicColors.applyToActivityIfAvailable(this) in
      #    MainActivity.java — this is the actual API that turns on
      #    wallpaper-derived colors at runtime; it's a method call,
      #    not a theme name.
      # 4. Reads the resolved colorPrimary/colorSecondary theme
      #    attributes and pushes them into the WebView as
      #    window.__dynamicColors / CSS variables.
      #
      # Falls back harmlessly on API < 31 (colors just won't be
      # Material-You-derived, no crash).
      # ============================================================
      - name: Inject dynamic color bridge
        run: |
          # --------------------------------------------------------
          # 1. Add Material Components dependency to app/build.gradle
          # --------------------------------------------------------
          GRADLE_FILE=android/app/build.gradle

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: $GRADLE_FILE not found."
            exit 1
          fi

          if ! grep -q "com.google.android.material:material" "$GRADLE_FILE"; then
            sed -i \
              "s#implementation project(':capacitor-android')#implementation project(':capacitor-android')\n    implementation 'com.google.android.material:material:1.12.0'#" \
              "$GRADLE_FILE"
            echo "Added Material Components dependency to $GRADLE_FILE"
          else
            echo "Material Components dependency already present, skipping."
          fi

          cat "$GRADLE_FILE"


          # --------------------------------------------------------
          # 2. Set theme parent to a real Material3 style
          # --------------------------------------------------------
          STYLES=android/app/src/main/res/values/styles.xml

          if [ -f "$STYLES" ]; then
            sed -i \
              's#parent="Theme\.AppCompat[^"]*"#parent="Theme.Material3.DayNight.NoActionBar"#' \
              "$STYLES"
            echo "Patched theme parent in $STYLES"
            cat "$STYLES"
          else
            echo "WARNING: styles.xml not found at expected path, skipping theme patch."
          fi


          # --------------------------------------------------------
          # 3 & 4. Patch MainActivity.java
          # --------------------------------------------------------
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "Patching $MAIN_ACTIVITY"

          PACKAGE_LINE=$(grep '^package ' "$MAIN_ACTIVITY")

          cat > "$MAIN_ACTIVITY" << JAVA_EOF
          $PACKAGE_LINE

          import android.os.Bundle;
          import android.util.TypedValue;
          import com.getcapacitor.BridgeActivity;
          import com.google.android.material.color.DynamicColors;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  // Must run before super.onCreate() applies the theme.
                  DynamicColors.applyToActivityIfAvailable(this);

                  super.onCreate(savedInstanceState);

                  bridge.getWebView().post(() -> {
                      String js = "window.__dynamicColors = " + buildPaletteJson() + ";"
                          + "document.dispatchEvent(new CustomEvent('dynamic-colors-ready',"
                          + "{ detail: window.__dynamicColors }));";
                      bridge.getWebView().evaluateJavascript(js, null);
                  });
              }

              private String buildPaletteJson() {
                  int[] attrs = {
                      android.R.attr.colorPrimary,
                      android.R.attr.colorSecondary
                  };
                  String[] keys = { "primary", "secondary" };

                  StringBuilder sb = new StringBuilder("{");
                  TypedValue tv = new TypedValue();

                  for (int i = 0; i < attrs.length; i++) {
                      getTheme().resolveAttribute(attrs[i], tv, true);
                      String hex = String.format("#%06X", 0xFFFFFF & tv.data);
                      sb.append("\"").append(keys[i]).append("\":\"").append(hex).append("\"");
                      if (i < attrs.length - 1) sb.append(",");
                  }
                  sb.append("}");
                  return sb.toString();
              }
          }
          JAVA_EOF

          echo "=========================================="
          echo "MainActivity.java patched:"
          echo "=========================================="
          cat "$MAIN_ACTIVITY"


          # --------------------------------------------------------
          # JS listener injected into www/ (already prepared earlier)
          # --------------------------------------------------------
          cat > www/dynamic-color-bridge.js << 'SCRIPT_EOF'
          (function () {
            function apply(palette) {
              if (!palette) return;
              Object.entries(palette).forEach(function (entry) {
                document.documentElement.style.setProperty('--md-' + entry[0], entry[1]);
              });
            }

            document.addEventListener('dynamic-colors-ready', function (e) {
              apply(e.detail);
            });

            if (window.__dynamicColors) {
              apply(window.__dynamicColors);
            }
          })();
          SCRIPT_EOF

          if [ -f www/index.html ]; then
            sed -i \
              's#</body>#<script src="dynamic-color-bridge.js"></script></body>#' \
              www/index.html
          fi


      # ============================================================
      # STORAGE PERMISSION
      # ============================================================
      - name: Add storage permission
        run: |
          sed -i \
            '/<manifest /a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' \
            android/app/src/main/AndroidManifest.xml


      # ============================================================
      # PREPARE APP ICON
      #
      # YOU PROVIDE:
      #
      #     logo.png
      #
      # Recommended:
      #     2048x2048 or 4096x4096
      #
      # The workflow does NOT resize, crop, trim, recolor,
      # or otherwise modify your logo.
      #
      # It simply gives the exact PNG to Capacitor Assets.
      # ============================================================
      - name: Prepare app icon
        run: |
          if [ ! -f logo.png ]; then
            echo "ERROR: logo.png was not found in repository root."
            echo ""
            echo "Please add your finished HD app icon as:"
            echo "    logo.png"
            exit 1
          fi

          mkdir -p assets-icon

          cp logo.png assets-icon/logo.png

          echo "=========================================="
          echo "App icon:"
          echo "=========================================="

          file assets-icon/logo.png


      # ============================================================
      # INSTALL CAPACITOR ASSETS
      # ============================================================
      - name: Install Capacitor Assets
        run: |
          npm install --save-dev @capacitor/assets


      # ============================================================
      # GENERATE ANDROID ICONS
      #
      # Capacitor Assets Easy Mode:
      #
      #     logo.png
      #        ↓
      #     Android launcher resources
      #
      # We provide explicit background colors so Capacitor can
      # generate the adaptive icon background consistently.
      # ============================================================
      - name: Generate Android icons
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets-icon \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#111111"


      # ============================================================
      # SYNC CAPACITOR
      # ============================================================
      - name: Sync Android project
        run: |
          npx cap sync android


      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ============================================================
      # BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}

          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk

          if-no-files-found: ignore
